# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The database lives on Neon; paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: ffvii-timeline-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Leaves the database to sleep between visits; the API checks it each time it starts.
    healthCheckPath: /live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
