name: Android app

# Pushing a version tag (v1.0.0) builds the signed APK and attaches it to a GitHub Release of that
# name. The signing key lives in four repository secrets (docs/android.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Run by hand (Actions → Android app → Run workflow), it builds the APK without releasing it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: pnpm install --frozen-lockfile

      - name: Build the site into the app
        run: pnpm --filter @ffvii/android sync

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing (docs/android.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # A commit from Windows doesn't mark the Gradle wrapper executable.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FFVII-Timeline-Analyzer-${APP_VERSION}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v7
        with:
          name: FFVII-Timeline-Analyzer-${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/FFVII-Timeline-Analyzer-${{ env.APP_VERSION }}.apk
          retention-days: 14

      - name: Release it
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/FFVII-Timeline-Analyzer-${APP_VERSION}.apk" \
            --title "FFVII Timeline Analyzer $GITHUB_REF_NAME (Android)" \
            --notes "Download the APK below and open it on your Android phone (Android 7 or later). Android asks you to allow installs from your browser or files app the first time. It needs an internet connection: the story data comes from the same server as the website, https://ffvii-timeline-analyzer.vercel.app.

          A non-commercial fan project. Final Fantasy VII and its artwork and music © Square Enix."
