name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build the web app
        run: pnpm web:build

      - name: Bundle stays within budget
        run: pnpm web:size

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ffvii
          POSTGRES_PASSWORD: ffvii
          POSTGRES_DB: ffvii
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ffvii -d ffvii"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ffvii:ffvii@localhost:5433/ffvii
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)"

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm test:db

  e2e:
    # Whole journeys in a real browser, against the API on a seeded database and the production
    # build of the web app, plus accessibility audits (docs/decisions/0013-hardening.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ffvii
          POSTGRES_PASSWORD: ffvii
          POSTGRES_DB: ffvii
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ffvii -d ffvii"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ffvii:ffvii@localhost:5433/ffvii
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - name: Install the browser
        run: pnpm --filter @ffvii/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t ffvii-api .
