name: Keep the API awake

# Render's free plan puts the API to sleep after 15 minutes without a visit. A call every few minutes
# keeps it up (one service fits in the free plan's 750 hours a month); /live leaves the database to
# sleep. GitHub runs this far less often than asked on a quiet repository (every few hours), so the
# main caller is cron-job.org (docs/deploy.md) and this is a backup. GitHub also pauses it after 60
# days without a push.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the API
        # A sleeping API can take minutes to answer the first call, so allow for it.
        run: curl --fail --silent --show-error --max-time 300 --retry 3 --retry-delay 10 https://ffvii-timeline-api.onrender.com/live
