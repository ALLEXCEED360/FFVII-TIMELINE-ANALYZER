name: Keep the API awake

# Render's free plan puts the API to sleep after 15 minutes without a visit, and waking it takes
# minutes. A call every few minutes keeps it up (one service fits in the free plan's 750 hours a
# month). It calls /live, which leaves the database to sleep. GitHub may run these late at busy
# times, so the interval leaves room; it also pauses them after 60 days without a push.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the API
        # A sleeping API can take minutes to answer the first call, so allow for it.
        run: curl --fail --silent --show-error --max-time 300 --retry 3 --retry-delay 10 https://ffvii-timeline-api.onrender.com/live
