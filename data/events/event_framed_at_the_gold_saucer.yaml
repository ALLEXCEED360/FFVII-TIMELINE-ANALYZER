    summary: >-
      Looking for Sephiroth's trail, Cloud meets Cait Sith, a fortune-telling toy who reads that he
      will get what he pursues but lose something dear, and then invites himself along. At the
      Battle Square they find bodies, all shot; a dying man says it was a man with a gun on his
      arm. Dio arrives, blames the party, and drops them from the park into the desert prison.
