id: event_mako_reactor_5_bombing
name: Bombing of Mako Reactor 5
summary: >-
  AVALANCHE's second reactor raid, on Mako Reactor 5, which Shinra has turned into a trap.
when: { year: 0 }
seq: 120
importance: 2
arc: arc_midgar

appearances:
  - title: og
    status: depicted
    summary: >-
      Cloud, Barret and Tifa ride the train to Sector 5, crawl under the plate through a duct and
      set the bomb. On the way out, President Shinra is waiting with soldiers; he leaves them to the
      Air Buster, a machine from the Weapon Development Department. After the fight Cloud is left
      hanging from the walkway, and falls.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_5 }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_reactor_5, scene: "the trap on the reactor walkway" }
    certainty: stated

  - title: remake
    status: depicted
    summary: >-
      Cloud, Barret and Tifa plant a bomb with a remote detonator. Heidegger broadcasts the raid
      live across Midgar as a spectacle, and President Shinra, waiting at the end of the walkway,
      calls AVALANCHE allies of Wutai. The party destroys the airbuster, and Cloud falls.
    depictions:
      - { at: { title: remake, chapter: 7 }, framing: direct }
    sources:
      - { title: remake, chapter: 7, scene: "Heidegger's broadcast and the airbuster" }
    certainty: stated

  - title: intermission
    status: referenced
    summary: >-
      Scarlet tells Midgar on the news that the reactor has been shut down and its fires put out,
      and that the bomb looks like the one used on Mako Reactor 1.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: mention }
    sources:
      - { title: intermission, chapter: 1, scene: "the screen in the Sector 7 slums" }
    certainty: stated

differences:
  - key: broadcast
    from: { title: og }
    to: { title: remake }
    category: context
    magnitude: minor
    summary: >-
      In OG, the trap is sprung out of sight of the city; in Remake, Heidegger turns it into a live
      broadcast, and the news presents the raid as a terrorist attack Shinra is foiling.
    sources:
      - { title: og, disc: 1, segment: og_reactor_5 }
      - { title: remake, chapter: 7, scene: "Heidegger's broadcast" }
    certainty: stated

  - key: wutai
    from: { title: og }
    to: { title: remake }
    category: context
    magnitude: minor
    summary: >-
      In OG, President Shinra dismisses AVALANCHE as vermin; in Remake, he declares them allies of
      Wutai, Shinra's enemy in the war.
    sources:
      - { title: og, disc: 1, segment: og_reactor_5, scene: "the President on the walkway" }
      - { title: remake, chapter: 7, scene: "the President on the walkway" }
    certainty: stated

relationships:
  - type: occurred_at
    target: location_midgar
    titles:
      og: { sources: [{ title: og, disc: 1, segment: og_reactor_5 }], certainty: stated }
      remake: { sources: [{ title: remake, chapter: 7 }], certainty: stated }

  - type: caused
    target: event_aerith_hires_cloud
    titles:
      og:
        sources:
          - { title: og, disc: 1, segment: og_reactor_5, scene: "Cloud falls from the reactor" }
          - {
              title: og,
              disc: 1,
              segment: og_sector_5_church,
              scene: "'It suddenly fell on top of me'",
            }
        certainty: stated
      remake:
        sources:
          - { title: remake, chapter: 7, scene: "Cloud falls from the reactor" }
          - { title: remake, chapter: 8, scene: "'You came crashing through the roof'" }
        certainty: stated
