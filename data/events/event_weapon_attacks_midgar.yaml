id: event_weapon_attacks_midgar
name: Weapon Attacks Midgar
summary: >-
  A Weapon comes out of the sea and marches on Midgar. Shinra's new mako cannon, the Sister Ray,
  fires through it, and in the attack Rufus is reported dead.
when: { year: 0 }
seq: 350
importance: 2
arc: arc_shinras_last_stand

appearances:
  - title: og
    status: depicted
    summary: >-
      Rufus has moved Junon's great cannon to Midgar to fire at Sephiroth. As Weapon closes in, the
      party fights it on land, then watches the Sister Ray's shot tear through it and break
      Sephiroth's barrier around the Northern Crater. In the Shinra Building, Heidegger can't reach
      the President, then declares him dead.
