id: event_yuffie_raid_on_shinra
name: Yuffie's Raid on Shinra Headquarters
summary: >-
  Yuffie and Sonon, agents of Wutai, infiltrate the Shinra Building to steal its "ultimate
  materia"; the operation ends with Sonon's death.
when: { year: 0 }
seq: 135
importance: 2
arc: arc_midgar

appearances:
  - title: intermission
    status: depicted
    summary: >-
      With AVALANCHE's help, Yuffie and Sonon get into the Shinra Building, where Scarlet toys with
      them and reveals that the materia isn't finished and that Shinra will drop the Sector 7 plate
      and blame AVALANCHE and Wutai. They defeat Nero of Deepground, but Sonon is killed covering
      Yuffie's escape.
    depictions:
