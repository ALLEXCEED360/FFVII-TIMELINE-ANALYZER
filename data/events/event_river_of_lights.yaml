appearances:
  - title: rebirth
    status: depicted
    summary: >-
      After a seminar where Tifa tries to tell the planetologists what she saw in the Lifestream,
      the canyon gathers at the great torch. Aerith says she has been held, watched and even hated
      since she was little because of her blood; it has been a curse, but it has also brought her
      friends she loves, and she means to repay their kindness and make the most of what she has
      been given.
