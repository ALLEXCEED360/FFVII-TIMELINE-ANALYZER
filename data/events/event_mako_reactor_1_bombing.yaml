id: event_mako_reactor_1_bombing
name: Bombing of Mako Reactor 1
summary: AVALANCHE's attack on Shinra's Mako Reactor 1 in Midgar, the opening mission of the story.
when: { year: 0 }
seq: 10
importance: 2
arc: arc_midgar

appearances:
  - title: og
    status: depicted
    summary: >-
      Barret leads AVALANCHE, with Cloud as a hired ex-SOLDIER, into the reactor. Cloud sets the
      bomb and the group escapes on a ten-minute countdown.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_1 }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_reactor_1, scene: "Barret: Cloud, you set the bomb" }
    certainty: stated

  - title: remake
    status: depicted
    summary: >-
      The same raid, expanded into the first chapter. Cloud sets the timer on the bomb Jessie
      built; afterwards Jessie is troubled that it caused a far bigger explosion than it should
      have.
    depictions:
      - { at: { title: remake, chapter: 1 }, framing: direct }
      - {
          at: { title: remake, chapter: 2 },
          framing: mention,
          note: "Jessie questions the size of the blast",
        }
    sources:
      - { title: remake, chapter: 1, scene: "setting the charge at the reactor core" }
      - { title: remake, chapter: 2, scene: "Jessie talks to Cloud about the explosion" }
    certainty: stated

differences:
  - key: timer
    from: { title: og }
    to: { title: remake }
    category: gameplay
    magnitude: minor
    summary: >-
      In OG the bomb runs on a fixed ten-minute countdown; in Remake the player chooses a
      twenty- or thirty-minute timer.
    sources:
      - { title: og, disc: 1, segment: og_reactor_1, scene: "Ten minutes to detonation!" }
      - { title: remake, chapter: 1, scene: "Set the timer" }
    certainty: stated

  - key: blast_size
    from: { title: og }
    to: { title: remake }
    category: context
    magnitude: minor
    summary: >-
      In Remake, Jessie says afterwards that her bomb shouldn't have produced an explosion that
      big — a doubt the original never raises.
    sources:
      - { title: og, disc: 1, segment: og_reactor_1 }
      - { title: remake, chapter: 2, scene: "Jessie talks to Cloud about the explosion" }
    certainty: stated

relationships:
  - type: occurred_at
    target: location_midgar
    titles:
      og: { sources: [{ title: og, disc: 1, segment: og_reactor_1 }], certainty: stated }
      remake: { sources: [{ title: remake, chapter: 1 }], certainty: stated }
