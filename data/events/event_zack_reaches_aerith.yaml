      - { title: rebirth, part: interlude, scene: "'Protect the Ancient!'" }
      - {
          title: rebirth,
          part: interlude,
          scene: "Mother and Daughter: 'I'm going to take her home'",
        }
    certainty: stated
    notes: New in the Remake series; the original has no counterpart.

