id: event_junon_execution
name: The Execution in Junon
summary: >-
  Shinra blames Tifa and Barret for Meteor and sets out to execute them on live television in
  Junon; a Weapon's attack breaks it up, and the Highwind carries them off.
when: { year: 0 }
seq: 305
importance: 2
