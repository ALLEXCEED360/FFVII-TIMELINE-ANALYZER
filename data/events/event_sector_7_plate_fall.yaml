id: event_sector_7_plate_fall
name: Fall of the Sector 7 Plate
summary: Shinra brings the upper plate of Sector 7 down onto the slums beneath it.
when: { year: 0 }
seq: 140
importance: 3
arc: arc_midgar

appearances:
  - title: og
    status: depicted
    summary: >-
      Don Corneo lets slip that Shinra means to drop the plate on AVALANCHE's hideout, a plan the
      President welcomes. At the top of the pillar, Reno of the Turks triggers the Emergency Plate
      Release System. Tseng arrives with Aerith as a hostage; Cloud, Tifa and Barret escape by
      swinging clear on a wire as the plate comes down. Biggs, Wedge and Jessie are left dying at
      the pillar.
    depictions:
      - { at: { title: og, disc: 1, segment: og_sector_7_pillar }, framing: direct }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_sector_7_pillar,
          scene: "the battle at the top of the pillar",
        }
      - { title: og, disc: 1, segment: og_wall_market, scene: "Corneo: 'The plate'll go PING'" }
      - {
          title: og,
          disc: 1,
          segment: og_wall_market,
          scene: "the President: 'We'll destroy Sector 7 and report that AVALANCHE did it'",
        }
    certainty: stated

  - title: remake
    status: depicted
    summary: >-
      Corneo lets slip that Shinra will bring down the pillar, and the President overrules Reeve's
      plea for the 50,000 people below. Cloud, Tifa and Aerith race through the sewers and the
      train graveyard back to Sector 7. Reno and Rude fight the party at the top of the pillar.
      Aerith finds Marlene, then Tseng takes her into custody and addresses the party over a
      monitor as the plate separates.
    depictions:
      - { at: { title: remake, chapter: 10 }, framing: direct }
      - { at: { title: remake, chapter: 11 }, framing: direct }
      - { at: { title: remake, chapter: 12 }, framing: direct, primary: true }
    sources:
      - { title: remake, chapter: 9, scene: "Corneo: 'The plate will come crashing down!'" }
      - { title: remake, chapter: 10, scene: "Escape to the Surface: Reeve's plea" }
      - { title: remake, chapter: 11, scene: "A Train Wreck: the train graveyard" }
      - { title: remake, chapter: 12, scene: "Showdown at the top of the pillar" }
    certainty: stated

  - title: intermission
    status: referenced
    summary: >-
      Yuffie overhears Scarlet say that Shinra will drop the Sector 7 plate on the slums and blame
      it on AVALANCHE and Wutai.
    depictions:
      - { at: { title: intermission, chapter: 2 }, framing: mention }
    sources:
      - { title: intermission, chapter: 2, scene: "Scarlet reveals the plan" }
    certainty: stated

  - title: rebirth
    world: world_zack_survives
    status: referenced
    summary: A news report on the expressway collapse lists the fall of the Sector 7 plate among Midgar's recent disasters.
    depictions:
      - { at: { title: rebirth, part: interlude }, framing: mention }
    sources:
      - { title: rebirth, part: interlude, scene: "the reporter on the Midgar Expressway" }
    certainty: stated

differences:
  - key: rude_fights
    from: { title: og }
    to: { title: remake }
    category: participants
    magnitude: minor
    summary: >-
      In OG, Reno alone fights the party at the top of the pillar; in Remake, Rude fights
      alongside him.
    sources:
      - { title: og, disc: 1, segment: og_sector_7_pillar }
      - { title: remake, chapter: 12 }
    certainty: stated

  - key: aerith_capture
    from: { title: og }
    to: { title: remake }
    category: presentation
    magnitude: minor
    summary: >-
      In OG, Tseng appears at the top of the pillar holding Aerith hostage; in Remake, he takes
      her after she finds Marlene and speaks to the party over a monitor.
    sources:
      - { title: og, disc: 1, segment: og_sector_7_pillar, scene: "Tseng and his 'special guest'" }
      - { title: remake, chapter: 12, scene: "Saving Marlene; Tseng on the monitor" }
    related: [character_aerith_gainsborough]
    certainty: stated

relationships:
