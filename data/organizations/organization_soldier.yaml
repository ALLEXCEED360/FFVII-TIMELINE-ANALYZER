id: organization_soldier
name: SOLDIER
summary: Shinra's elite fighting force, whose members are marked by eyes that glow from exposure to mako.

appearances:
  - title: og
    status: depicted
    summary: >-
      Cloud claims to be a former member; Sephiroth was its greatest. In the Lifestream it emerges
      that Cloud never made it in.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_1 }, framing: mention }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_reactor_1,
          scene: "'You used to be in SOLDIER all right!'",
        }
      - {
          title: og,
          disc: 2,
          segment: og_inside_clouds_mind,
          scene: "'I...never made it as a member of SOLDIER'",
        }
    certainty: stated

  - title: remake
    status: referenced
    summary: >-
      Cloud calls himself an ex-SOLDIER; President Shinra hints that SOLDIERs die young, and Rufus
      claims to own any SOLDIER.
    depictions:
      - { at: { title: remake, chapter: 7 }, framing: mention }
    sources:
      - { title: remake, chapter: 7, scene: "'Once a SOLDIER, always a SOLDIER'" }
      - {
          title: remake,
          chapter: 17,
          scene: "'You're a SOLDIER, aren't you? Which, of course, would mean that I own you.'",
        }
    certainty: stated

  - title: rebirth
    status: depicted
    summary: In Cloud's account, he is a SOLDIER First Class sent to Nibelheim with Sephiroth.
    depictions:
      - { at: { title: rebirth, chapter: 1 }, framing: disputed_account }
    sources:
      - { title: rebirth, chapter: 1, scene: "'Finally make First'" }
    certainty: stated

  - title: remake
    world: world_zack_survives
    status: referenced
    summary: Zack, making his last stand, tells himself to protect his honour as a SOLDIER.
    depictions:
      - { at: { title: remake, chapter: 18 }, framing: mention }
    sources:
      - {
          title: remake,
          chapter: 18,
          scene: "The Turning Point: 'Protect your honor...as a SOLDIER!'",
        }
    certainty: stated

  - title: rebirth
    world: world_zack_survives
    status: referenced
    summary: Shinra security hunts Zack through Midgar as an armed ex-SOLDIER.
    depictions:
      - { at: { title: rebirth, part: interlude }, framing: mention }
    sources:
      - { title: rebirth, part: interlude, scene: "A World Apart: 'the fugitive is an ex-SOLDIER'" }
    certainty: stated

relationships:
  - type: part_of
    target: organization_shinra
    titles:
      og:
        sources:
          - {
              title: og,
              disc: 1,
              segment: og_reactor_5,
              scene: "President Shinra: 'You're the one who quit SOLDIER'",
            }
          - {
              title: og,
              disc: 1,
              segment: og_kalm,
              scene: "'After the war it was SOLDIER's duty to put down any resistance against the Shinra'",
            }
        certainty: inferred
        notes: >-
          The President speaks of a SOLDIER who left him as a traitor, and Cloud describes SOLDIER
          doing Shinra's work; the transcript doesn't call it a part of Shinra outright.
      remake:
        sources:
          [
            {
              title: remake,
              chapter: 17,
              scene: "'You're a SOLDIER... which would mean that I own you'",
            },
          ]
        certainty: stated
