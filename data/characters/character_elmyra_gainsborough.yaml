id: character_elmyra_gainsborough
name: Elmyra Gainsborough
summary: The woman who took in the young Aerith and raised her as her daughter.

appearances:
  - title: og
    status: depicted
    role: Aerith's adoptive mother
    summary: >-
      Meets Cloud when Aerith brings him home, and later tells how she took Aerith in fifteen years
      earlier, after her mother died at the station.
    depictions:
      - {
          at: { title: og, disc: 1, segment: og_sector_5_church },
          framing: direct,
          note: "at Aerith's house",
        }
    sources:
      - { title: og, disc: 1, segment: og_sector_5_church, scene: "'This is Cloud. My bodyguard.'" }
      - { title: og, disc: 1, segment: og_aerith_story, scene: "Elmyra's story" }
    certainty: stated

  - title: remake
    status: depicted
    role: Aerith's adoptive mother
    summary: >-
      Meets Cloud when Aerith brings him home, looks after Marlene, and tells the story of how she
      took Aerith in.
    depictions:
      - { at: { title: remake, chapter: 8 }, framing: direct }
    sources:
      - { title: remake, chapter: 8, scene: "To Aerith's House" }
      - { title: remake, chapter: 13, scene: "Words of Hope" }
    certainty: stated

  - title: rebirth
    status: referenced
    summary: Aerith, travelling with Cloud, wonders how her mother is holding up back in Midgar.
    depictions:
      - { at: { title: rebirth, chapter: 4 }, framing: mention }
    sources:
      - { title: rebirth, chapter: 4, scene: "Respite: 'how Mom and Marlene are holding up'" }
      - {
          title: rebirth,
          chapter: 7,
          scene: "To the Summit: 'I wonder how my mom's doing back there'",
        }
    certainty: stated

  - title: rebirth
    world: world_zack_survives
    status: depicted
    role: Aerith's mother
    summary: Comes to take the unconscious Aerith home from Zack's hideout in the Sector 5 undercity.
    depictions:
      - { at: { title: rebirth, part: interlude }, framing: direct }
    sources:
      - { title: rebirth, part: interlude, scene: "Knock at the Door" }
    certainty: stated

