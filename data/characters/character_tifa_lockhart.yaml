id: character_tifa_lockhart
name: Tifa Lockhart
summary: Cloud's childhood friend from Nibelheim, who runs the Seventh Heaven bar in Sector 7.

appearances:
  - title: og
    status: depicted
    role: Runs Seventh Heaven and fights with AVALANCHE; Cloud's childhood friend
    summary: >-
      Runs the bar where AVALANCHE has its hideout; later guides Cloud through his own memories in
      the Lifestream.
    depictions:
      - { at: { title: og, disc: 1, segment: og_seventh_heaven }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_seventh_heaven }
      - {
          title: og,
          disc: 1,
          segment: og_sector_7_pillar,
          scene: "I have a bar called '7th Heaven'",
        }
    certainty: stated

  - title: remake
    status: depicted
    role: Runs Seventh Heaven and fights with AVALANCHE; Cloud's childhood friend
    summary: First seen in a flashback during the reactor raid, then at Seventh Heaven.
    depictions:
      - { at: { title: remake, chapter: 1 }, framing: flashback }
      - { at: { title: remake, chapter: 3 }, framing: direct, primary: true }
    sources:
      - { title: remake, chapter: 1, scene: "flashback while waiting for the elevator" }
      - { title: remake, chapter: 3 }
    certainty: stated

  - title: intermission
    status: depicted
    summary: Seen with AVALANCHE during Yuffie's mission, and with the party in the post-credits scene.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: direct }
    sources:
      - { title: intermission, chapter: 1 }
      - { title: intermission, chapter: 2, scene: "post-credits scene" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: Travels with Cloud; questions his account of Nibelheim
    summary: Doubts Cloud's story of Nibelheim, and is present at Aerith's death.
    depictions:
      - { at: { title: rebirth, chapter: 1 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 1 }
      - { title: rebirth, chapter: 14 }
    certainty: stated

