id: character_don_corneo
name: Don Corneo
summary: The lecherous boss of Wall Market, who picks a "bride" from the women brought to his mansion.

appearances:
  - title: og
    status: depicted
    role: Boss of Wall Market, working for Heidegger
    summary: >-
      Picks a bride from Cloud, Tifa and Aerith, then confesses under threat that Heidegger hired
      him to find Barret and that Shinra will drop the Sector 7 plate.
    depictions:
      - { at: { title: og, disc: 1, segment: og_wall_market }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_wall_market, scene: "Don Corneo's bedroom" }
    certainty: stated

  - title: remake
    status: depicted
    role: Boss of Wall Market, working for Heidegger
    summary: >-
      Chooses the disguised Cloud at his audition, then confesses that Heidegger paid him to find
      Barret and that Shinra will blow up the Sector 7 pillar.
    depictions:
      - { at: { title: remake, chapter: 9 }, framing: direct }
    sources:
      - { title: remake, chapter: 9, scene: "Showdown with Corneo" }
    certainty: stated

  - title: intermission
    status: referenced
    summary: His men try to recruit a bride for him in the Sector 7 slums.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: mention }
    sources:
      - { title: intermission, chapter: 1, scene: "The Handoff" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: A Midgar crime boss, now at the Gold Saucer
    summary: >-
      His family challenges Dio for the Gold Saucer's naming rights in a fight against Dio's
      champions, and he enters the ring himself before losing to the party.
    depictions:
      - { at: { title: rebirth, chapter: 12 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 12, scene: "the fight for naming rights" }
    certainty: stated

