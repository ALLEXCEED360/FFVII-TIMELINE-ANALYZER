id: character_tseng
name: Tseng
summary: A senior member of the Turks, who has known Aerith since she was a child.

appearances:
  - title: og
    status: depicted
    role: A Turk pursuing Aerith for Shinra
    summary: >-
      Takes Aerith from the Sector 7 pillar, captures the party in the Shinra Building, and is
      struck down by Sephiroth in the Temple of the Ancients.
    depictions:
      - { at: { title: og, disc: 1, segment: og_sector_7_pillar }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_sector_7_pillar }
      - { title: og, disc: 1, segment: og_temple_of_the_ancients, scene: "Tseng at the altar" }
    certainty: stated

  - title: remake
    status: depicted
    role: A Turk directing the plate drop
    summary: Gives Reno the plate separation code, and takes Aerith into custody at the pillar.
    depictions:
      - { at: { title: remake, chapter: 11 }, framing: direct, note: "over the radio" }
      - { at: { title: remake, chapter: 12 }, framing: direct, primary: true }
    sources:
      - { title: remake, chapter: 11, scene: "Blocked Road" }
      - { title: remake, chapter: 12, scene: "Tseng on the monitor" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: A Turk
    summary: >-
      Tells the party in the Mythril Mine that the Turks will leave them alone if they stay out of
      the way, and is struck down by Sephiroth in the Temple of the Ancients.
    depictions:
      - { at: { title: rebirth, chapter: 3 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 3, scene: "Where They Lead" }
      - { title: rebirth, chapter: 13, scene: "Hall of Resurrection" }
    certainty: stated

