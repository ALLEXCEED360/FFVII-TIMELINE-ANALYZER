id: character_hojo
name: Hojo
aliases: [Professor Hojo]
summary: A Shinra scientist whose experiments with Jenova lie behind Sephiroth, SOLDIER and much else.

appearances:
  - title: og
    status: depicted
    role: Head of Shinra's Science Department
    summary: >-
      Studies Aerith as a specimen and plans to breed her with Red XIII; later resigns from Shinra.
      At the Northern Crater he calls Cloud a failed Sephiroth clone of his making, and in Midgar he
      reveals that he is Sephiroth's father.
    depictions:
      - { at: { title: og, disc: 1, segment: og_shinra_building }, framing: direct }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_shinra_building,
          scene: "the board meeting and Hojo's laboratory",
        }
      - { title: og, disc: 2, segment: og_northern_crater }
      - { title: og, disc: 2, segment: og_midgar_raid, scene: "Hojo atop the Mako Cannon" }
    certainty: stated

  - title: remake
    status: depicted
    role: Shinra's director of Research and Development
    summary: >-
      Holds Aerith in his laboratory, the Drum, and speaks of her mother, the last pure-blooded
      Ancient, who tried to run.
    depictions:
      - { at: { title: remake, chapter: 16 }, framing: direct }
    sources:
      - { title: remake, chapter: 16, scene: "Playing the Tourist: Hojo's hologram" }
      - { title: remake, chapter: 16, scene: "A Helping Hand" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: A Shinra scientist following the black-robed men
    summary: >-
      Lets the attack on the Shinra-8 continue as an experiment, and turns up on the beach at Costa
      del Sol.
    depictions:
      - { at: { title: rebirth, chapter: 5 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 5, scene: "Passengers in Peril" }
      - { title: rebirth, chapter: 6, scene: "Hojo's Mojo" }
    certainty: stated

