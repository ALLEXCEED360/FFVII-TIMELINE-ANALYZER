id: character_biggs
name: Biggs
summary: A member of AVALANCHE who fights alongside Barret, Jessie and Wedge in Midgar.

appearances:
  - title: og
    status: depicted
    role: A member of AVALANCHE
    summary: >-
      Takes part in the raid on Mako Reactor 1 and the plans for Reactor 5, and is found badly
      wounded at the top of the Sector 7 pillar, telling Cloud to go and help Barret.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_1 }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_reactor_1 }
      - { title: og, disc: 1, segment: og_seventh_heaven }
      - { title: og, disc: 1, segment: og_sector_7_pillar, scene: "'Barret's...fighting up there'" }
    certainty: stated

  - title: remake
    status: depicted
    role: A member of AVALANCHE
    summary: >-
      Raids Mako Reactor 1, helps break into the Sector 7-6 annex, and is found hurt at the Sector
      7 pillar, asking Cloud not to let their fight be for nothing.
    depictions:
      - { at: { title: remake, chapter: 1 }, framing: direct }
    sources:
      - { title: remake, chapter: 1, scene: "Enter the Reactor Grounds" }
      - { title: remake, chapter: 4, scene: "Sector 7-6 Annex Infiltration" }
      - { title: remake, chapter: 12, scene: "Link Up with Avalanche" }
    certainty: stated

  - title: intermission
    status: depicted
    summary: >-
      Waits at the hideout with Jessie and Wedge, and greets the others back from Mako Reactor 5,
      asking where Cloud is.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: direct }
    sources:
      - { title: intermission, chapter: 1, scene: "Esteemed Avalanche Colleagues" }
      - { title: intermission, chapter: 1, scene: "The Handoff" }
    certainty: stated

  - title: rebirth
    status: referenced
    summary: Cloud sees him in a vision in the Temple of the Ancients.
    depictions:
      - { at: { title: rebirth, chapter: 13 }, framing: vision }
    sources:
      - { title: rebirth, chapter: 13, scene: "Corridor of Effigies: 'Biggs?'" }
    certainty: stated

  - title: rebirth
    world: world_zack_survives
    status: depicted
    role: Alive after Sector 7, looking for a reason to have survived
    summary: >-
      In the world where Zack survives, Biggs is alive and wonders why he was spared. He puts up
      flyers calling for new AVALANCHE recruits, but nobody comes, and Zack tells him it is up to
      each of them to find their own purpose. Later Biggs tells Zack he has found his in AVALANCHE
      and warns him to steer clear of Reactor 6. When Zack catches up with him there, the reactor
      has run dry and Biggs's bomb has failed.
    depictions:
      - { at: { title: rebirth, chapter: 10 }, framing: direct }
      - { at: { title: rebirth, chapter: 12 }, framing: direct }
      - { at: { title: rebirth, chapter: 14 }, framing: direct }
    sources:
      - {
          title: rebirth,
          chapter: 10,
          scene: "Biggs: 'I thought I might have been saved for a reason'",
        }
      - { title: rebirth, chapter: 12, scene: "'steer clear of Reactor 6'" }
      - { title: rebirth, chapter: 14, scene: "Biggs: 'figures it'd fail'" }
    certainty: stated

