id: character_wedge
name: Wedge
summary: A member of AVALANCHE, cheerful and fond of food, who fights alongside Biggs and Jessie.

appearances:
  - title: og
    status: depicted
    role: A member of AVALANCHE
    summary: >-
      Takes part in the raid on Mako Reactor 1, and is found wounded at the foot of the Sector 7
      pillar, apologising to Cloud for being no help.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_1 }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_reactor_1 }
      - { title: og, disc: 1, segment: og_sector_7_pillar, scene: "'You remembered......my name'" }
    certainty: stated

  - title: remake
    status: depicted
    role: A member of AVALANCHE
    summary: >-
      Raids Mako Reactor 1, causes a diversion during the raid on the Sector 7-6 annex, helps
      evacuate Sector 7 before the plate falls, and later turns up in the Shinra Building to show
      the party a way out, crying out "for Biggs, for Jessie" as Shinra closes in.
    depictions:
      - { at: { title: remake, chapter: 1 }, framing: direct }
    sources:
      - { title: remake, chapter: 1, scene: "Enter the Reactor Grounds" }
      - { title: remake, chapter: 4, scene: "A Little Diversion" }
      - { title: remake, chapter: 12, scene: "Evacuation Orders" }
      - { title: remake, chapter: 17, scene: "A Way Out" }
      - { title: remake, chapter: 17, scene: "The Great Escape" }
    certainty: stated

  - title: intermission
    status: depicted
    summary: Waits at the hideout with Biggs and Jessie for Cloud's group to come back.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: direct }
    sources:
      - { title: intermission, chapter: 1, scene: "Esteemed Avalanche Colleagues" }
    certainty: stated

