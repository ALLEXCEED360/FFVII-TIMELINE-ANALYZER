id: character_dyne
name: Dyne
summary: >-
  Barret's best friend from Corel and Marlene's father, who lost an arm and his family when Shinra
  burned the town.

appearances:
  - title: og
    status: depicted
    role: Barret's old friend, now the outlaw of Corel Prison
    summary: >-
      In Barret's memories he refuses to give Corel's coal mines up for Shinra's reactor, and
      clings to Barret's hand over a cliff when Shinra attacks the town. Found again in Corel
      Prison, bitter and wanting to destroy everything, he fights Barret, then gives him his wife
      Eleanor's pendant for Marlene and dies.
    depictions:
      - { at: { title: og, disc: 1, segment: og_corel }, framing: flashback }
      - { at: { title: og, disc: 1, segment: og_corel_prison }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_corel, scene: "'Dyne was my best friend'" }
      - { title: og, disc: 1, segment: og_corel_prison, scene: "'Give that pendant to Marlene'" }
      - { title: og, disc: 1, segment: og_corel_prison, scene: "'So Dyne's dead...'" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: Barret's old friend, the gunman behind the Gold Saucer shooting
    summary: >-
      Barret starts to recall riding the minecarts with him, and trails off. At the Gold Saucer,
      Barret names him as the man who shot the Coliseum guests; found in the desert below, he
      blames Barret for all he lost, fights him, and cannot face going back to Marlene.
    depictions:
      - { at: { title: rebirth, chapter: 7 }, framing: mention }
      - { at: { title: rebirth, chapter: 8 }, framing: direct, primary: true }
    sources:
      - { title: rebirth, chapter: 7, scene: "Continue Your Search: 'Me and Dyne used to...'" }
      - {
          title: rebirth,
          chapter: 8,
          scene: "Barret: 'I know the man who murdered all those people'",
        }
      - { title: rebirth, chapter: 8, scene: "Dyne: 'How could I ever hold my daughter again?'" }
    certainty: stated

