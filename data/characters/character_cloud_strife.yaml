id: character_cloud_strife
name: Cloud Strife
summary: A swordsman from Nibelheim who says he was once in SOLDIER, and the story's protagonist.

appearances:
  - title: og
    status: depicted
    role: A hired ex-SOLDIER, by his own account, who joins AVALANCHE's raid for pay
    summary: >-
      Joins AVALANCHE for money and is drawn into the pursuit of Sephiroth. His account of his own
      past proves false, and he recovers the truth in the Lifestream.
    depictions:
      - { at: { title: og, disc: 1, segment: og_reactor_1 }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_reactor_1, scene: "Biggs: You used to be in SOLDIER" }
      - { title: og, disc: 1, segment: og_seventh_heaven, scene: "I want to talk about my money" }
    certainty: stated

  - title: remake
    status: depicted
    role: A mercenary and self-described ex-SOLDIER working for AVALANCHE
    summary: Joins AVALANCHE's raids "for the paycheck" and is drawn into the fight against Shinra.
    depictions:
      - { at: { title: remake, chapter: 1 }, framing: direct }
    sources:
      - { title: remake, chapter: 1, scene: "I'm just here for the paycheck" }
    certainty: stated

  - title: remake
    world: world_zack_survives
    status: depicted
    role: Carried by Zack, unable to act for himself
    summary: Carried toward Midgar by Zack after Zack survives the Shinra troops.
    depictions:
      - { at: { title: remake, chapter: 18 }, framing: direct }
    sources:
      - { title: remake, chapter: 18, scene: "Almost there, Cloud" }
    certainty: stated

  - title: intermission
    status: depicted
    summary: >-
      Absent from Yuffie's mission (AVALANCHE mention having lost him); seen with the party
      leaving Midgar in the post-credits scene.
    depictions:
      - { at: { title: intermission, chapter: 1 }, framing: mention }
      - { at: { title: intermission, chapter: 2 }, framing: direct, note: post-credits scene }
    sources:
      - { title: intermission, chapter: 1, scene: "Where's Cloud? — We lost him." }
      - { title: intermission, chapter: 2, scene: "post-credits scene" }
    certainty: stated

  - title: rebirth
    status: depicted
    role: Leads the pursuit of Sephiroth beyond Midgar
    summary: Tells his account of Nibelheim at Kalm and follows Sephiroth to the Forgotten Capital.
    depictions:
      - { at: { title: rebirth, chapter: 1 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 1 }
      - { title: rebirth, chapter: 14 }
    certainty: stated

  - title: rebirth
    world: world_zack_survives
    status: depicted
    role: Unresponsive from mako poisoning, in Zack's care
    summary: Left by Zack in someone else's care in Midgar, "too much mako" in him.
    depictions:
      - { at: { title: rebirth, part: interlude }, framing: direct }
    sources:
      - { title: rebirth, part: interlude, scene: "Zack: Could ya look after my friend?" }
    certainty: stated

