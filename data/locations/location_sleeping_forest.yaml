          title: og,
          disc: 1,
          segment: og_bone_village,
          scene: "'This forest leads to the City of the Ancients... and is called the Sleeping Forest'",
        }
      - {
          title: og,
          disc: 1,
          segment: og_bone_village,
          scene: "Bone Village: 'Right now the forest is asleep'",
        }
