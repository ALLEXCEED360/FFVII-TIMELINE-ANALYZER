id: location_costa_del_sol
name: Costa del Sol
summary: A beach resort town on the western continent, where the ships from Junon put in.

appearances:
  - title: og
    status: depicted
    summary: >-
      The cargo ship from Junon docks here, and the party finds Hojo sunbathing on the beach.
    depictions:
      - { at: { title: og, disc: 1, segment: og_costa_del_sol }, framing: direct }
    sources:
