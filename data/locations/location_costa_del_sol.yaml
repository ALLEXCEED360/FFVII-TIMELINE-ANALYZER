  - title: rebirth
    status: depicted
    summary: >-
      The ferry from Junon brings the party to the resort, where they spend a day at the beach,
      run into Hojo, and learn the black-robed figures have headed for Mt. Corel.
    depictions:
      - { at: { title: rebirth, chapter: 6 }, framing: direct }
    sources:
