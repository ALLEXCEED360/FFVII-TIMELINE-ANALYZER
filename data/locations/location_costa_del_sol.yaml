          title: og,
          disc: 1,
          segment: og_cargo_ship,
          scene: "'We will be docking in Costa del Sol in 5 minutes'",
        }
      - { title: og, disc: 1, segment: og_costa_del_sol, scene: "Hojo on the beach" }
