id: location_corel_prison
name: Corel Prison
aliases: [Desert Prison]
summary: >-
  A natural prison in the desert, ringed by quicksand, where criminals are left to fend for
  themselves.

appearances:
  - title: og
    status: depicted
    summary: >-
      The party is sent down to it, blamed for killings at the Gold Saucer's Battle Arena. Barret finds Dyne living
      there, fights him, and wins the way out by a chocobo race.
    depictions:
      - { at: { title: og, disc: 1, segment: og_corel_prison }, framing: direct }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_corel_prison,
          scene: "'a natural prison in the middle of the desert'",
        }
      - { title: og, disc: 1, segment: og_corel_prison, scene: "Upon reaching Dyne's hideout" }
    certainty: stated

  - title: rebirth
    status: depicted
    summary: >-
      The Dustbowl below the Gold Saucer, where the park's staff once lived until fiends drove them
      out; with no bars and no rules, it has come to be called Corel Prison. The party goes down to
      find the gunman, and Barret finds Dyne in the desert beyond.
    depictions:
      - { at: { title: rebirth, chapter: 8 }, framing: direct }
    sources:
      - {
          title: rebirth,
          chapter: 8,
          scene: "'why else do you think they started calling it Corel Prison'",
        }
    certainty: stated
