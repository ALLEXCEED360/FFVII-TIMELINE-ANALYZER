id: location_train_graveyard
name: Train Graveyard
summary: >-
  A yard of abandoned train cars in the Sector 7 slums, said to be haunted, on the way to the
  Sector 7 pillar.

appearances:
  - title: og
    status: depicted
    summary: >-
      The last train out of Sector 8 is bound for it. Later the party climbs out of the sewers
      into it on the way to the Sector 7 pillar.
    depictions:
      - { at: { title: og, disc: 1, segment: og_sector_7_pillar }, framing: direct }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_reactor_1,
          scene: "'Last stop is Sector 7, Train Graveyard'",
        }
      - {
          title: og,
          disc: 1,
          segment: og_sector_7_pillar,
          scene: "After exiting the manhole to the Train Graveyard",
        }
    certainty: stated

  - title: remake
    status: depicted
    summary: >-
      Haunted by ghosts, it lies between the sewers and the Sector 7 undercity station; Cloud,
      Tifa and Aerith cross it on their way to the pillar.
    depictions:
      - { at: { title: remake, chapter: 11 }, framing: direct }
    sources:
      - { title: remake, chapter: 11, scene: "A Train Wreck: Train Graveyard" }
      - { title: remake, chapter: 11, scene: "Head for the Pillar: Sector 7 Undercity Station" }
    certainty: stated

relationships:
  - type: part_of
    target: location_sector_7
    titles:
      og:
        sources:
          - {
              title: og,
              disc: 1,
              segment: og_reactor_1,
              scene: "'Last stop is Sector 7, Train Graveyard'",
            }
        certainty: stated
      remake:
        sources:
          - { title: remake, chapter: 11, scene: "Head for the Pillar: Sector 7 Undercity Station" }
        certainty: inferred
        notes: >-
          The party walks from it straight into the Sector 7 undercity station; Remake doesn't name
          its sector in the transcript.
