id: location_gongaga
name: Gongaga
summary: >-
  A village in the jungle beside a ruined mako reactor, and Zack's home; its people gave up mako
  after the reactor blew up.

appearances:
  - title: og
    status: depicted
    summary: >-
      An optional stop. Since the reactor's explosion killed many of them, the villagers have
      turned their backs on mako; Zack's parents still wait for word of the son who left to join
      SOLDIER.
    depictions:
      - { at: { title: og, disc: 1, segment: og_gongaga }, framing: direct }
    sources:
      - {
          title: og,
          disc: 1,
          segment: og_gongaga,
          scene: "Villagers: 'One day, there was a huge explosion'",
        }
      - { title: og, disc: 1, segment: og_gongaga, scene: "The home of Zack's parents" }
    certainty: stated

  - title: rebirth
    status: depicted
    summary: >-
      A jungle village famous for its mushrooms. Its reactor failed three years ago after Shinra
      neglected it, and Shinra put up a memorial. A local militia, the Coalition, keeps watch, and
      Zack's parents still wait to hear from their son.
    depictions:
      - { at: { title: rebirth, chapter: 9 }, framing: direct }
    sources:
      - { title: rebirth, chapter: 9, scene: "'Welcome to Gongaga'" }
      - { title: rebirth, chapter: 9, scene: "the home of Zack's parents" }
    certainty: stated
