id: location_cosmo_canyon
name: Cosmo Canyon
summary: >-
  A canyon settlement devoted to the study of the planet, home of Bugenhagen and Red XIII's
  people.

appearances:
  - title: og
    status: depicted
    summary: Red XIII's hometown, where Bugenhagen shows him the truth about his father.
    depictions:
      - { at: { title: og, disc: 1, segment: og_cosmo_canyon }, framing: direct }
    sources:
      - { title: og, disc: 1, segment: og_cosmo_canyon, scene: "'this is my hometown'" }
    certainty: stated

  - title: rebirth
    status: depicted
    summary: >-
      Nanaki's home and the sanctum of planetology, where a Shinra airship has just dropped wanted
      posters of the party. Bugenhagen shows them the Lifestream in his planetarium, the canyon
      gathers at the torch for the River of Lights, and Bugenhagen reveals Seto's stand and sends
      Nanaki back out into the world.
    depictions:
      - { at: { title: rebirth, chapter: 10 }, framing: direct }
    sources:
