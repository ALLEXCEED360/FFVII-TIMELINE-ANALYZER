# The research log (docs/canon-and-sources.md §4): every source used to find or check the facts in
# data/. Facts cite the games themselves; these are how the citations were checked. Add a source
# here whenever you use a new one. Evidence is play, footage or a transcript; anything else may
# only be used to find where something happens.

- id: src_wiki_og_script
  name: Final Fantasy Wiki — Final Fantasy VII script
  kind: transcript
  role: evidence
  covers: [og]
  usedFor: Checking dialogue and on-screen text, and the order of the original's story segments.
  url: https://finalfantasy.fandom.com/wiki/Final_Fantasy_VII_script
  accessed: 2026-09-29
  notes: >-
    A full transcript of the original PlayStation release. Its stage directions are fan
    descriptions of what is shown, so facts that rest on them wait for a footage check.

- id: src_wiki_remake_script
  name: Final Fantasy Wiki — Final Fantasy VII Remake script
  kind: transcript
  role: evidence
  covers: [remake, intermission]
  usedFor: Checking dialogue and on-screen text, and chapter titles. Includes Episode INTERmission.
  url: https://finalfantasy.fandom.com/wiki/Final_Fantasy_VII_Remake_script
  accessed: 2026-09-29

- id: src_wiki_rebirth_script
  name: Final Fantasy Wiki — Final Fantasy VII Rebirth script
  kind: transcript
  role: evidence
  covers: [rebirth]
  usedFor: Checking dialogue, and stage directions for scenes that are mostly visual.
  url: https://finalfantasy.fandom.com/wiki/Final_Fantasy_VII_Rebirth_script
  accessed: 2026-09-29
