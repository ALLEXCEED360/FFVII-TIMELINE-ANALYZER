# Open questions (docs/canon-and-sources.md §4): facts in data/ that still need a stronger check,
# and things not yet verified well enough to add. Settle each by checking the game or footage,
# then delete it.

- id: question_aerith_death_rebirth_visuals
  kind: needs_footage
  summary: How Rebirth shows Aerith's death (chapter 14)
  details: >-
    Cloud appearing to block Sephiroth's blade before the scene resolves into her death, the
    funeral at the pool, and Cloud seeing Aerith afterwards while Tifa does not all rest on the
    transcript's stage directions, not dialogue.
  entities: [event_aerith_death]
  sources: [{ title: rebirth, chapter: 14 }]

- id: question_aerith_funeral_og
  kind: needs_footage
  summary: Aerith's funeral in the original (opening of disc 2)
  details: >-
    Laid to rest in the water in the cinematic that opens disc 2. Located through a walkthrough's
    screenshot caption only.
  entities: [event_aerith_death]
  sources: [{ title: og, disc: 2, segment: og_icicle_inn, scene: "the opening cinematic" }]

- id: question_remake_ending_visuals
  kind: needs_footage
  summary: Zack's survival at the end of Remake
  details: >-
    Zack surviving the fight outside Midgar and carrying Cloud. The dialogue supports it; the
    visuals haven't been checked.
  worlds: [world_zack_survives]
  sources: [{ title: remake, chapter: 18 }]

- id: question_zack_last_stand
  kind: not_in_dataset
  summary: Zack's last stand, the branch point of the world where he survives
  details: >-
    The original shows his death only visually, in an optional flashback that becomes available
    after "Inside Cloud's Mind"; the transcript has no dialogue that states it. Needs footage
    before it can be added as an event and set as the world's branch point.
  worlds: [world_zack_survives]

- id: question_rebirth_arc_chapters
  kind: not_in_dataset
  summary: Which Rebirth chapters retell each arc
  details: >-
    The arcs list Remake's chapters for the Midgar arc only. Rebirth's chapter-to-arc mapping
    needs a chapter-by-chapter check; the wiki transcript is incomplete for chapters 8 and 9.

- id: question_rebirth_main_world_midgar
  kind: not_in_dataset
  summary: Rebirth's main-world view of the plate fall and Midgar
  details: Only the interlude in the world where Zack survives is recorded so far.
  entities: [event_sector_7_plate_fall]
  sources: [{ title: rebirth, part: interlude }]

- id: question_disc_2_3_boundary
  kind: structure
  summary: Where disc 2 ends in the original
  details: >-
    Placed after the Highwind scenes (the Highwind segment on disc 2), per a walkthrough. Confirm
    in the game.

- id: question_chapter_title_capitalization
  kind: structure
  summary: Capitalization of chapter titles
  details: >-
    Sources disagree on small words (for example "Deeper into Darkness" against "Deeper Into
    Darkness"). Use the in-game spelling once checked.

- id: question_eras
  kind: structure
  summary: The eras are provisional
  details: The eras are display ranges for the timeline; revisit them as dated events are added.

- id: question_president_death_remake
  kind: needs_footage
  summary: How Remake shows President Shinra's death (chapter 17)
  details: >-
    The transcript has the party find the President in his office and Barret confront him, then
    Sephiroth's appearance; how the President dies is shown rather than said. Check the footage,
    then record it on the event and add Sephiroth's part.
  entities: [event_president_shinra_death, character_president_shinra]
  sources: [{ title: remake, chapter: 17, scene: "The Ominous Trail" }]

- id: question_rebirth_black_materia
  kind: needs_footage
  summary: What becomes of the black materia in Rebirth (chapters 13–14)
  details: >-
    The transcript breaks off as Cloud reaches the black materia and the temple begins to fall, and
    resumes with stage directions at the end of chapter 14 in which Cloud puts the black materia
    into his sword. Whether Cloud hands it over, what happens to Cait Sith, and whether Meteor is
    summoned all need checking against the game.
  entities: [event_race_for_the_black_materia, character_cait_sith, event_meteor_summoned]
  sources:
    - { title: rebirth, chapter: 13, scene: "Within Our Grasp" }
    - { title: rebirth, chapter: 14, scene: "the ending" }

- id: question_midgar_zolom
  kind: needs_footage
  summary: The Midgar Zolom found impaled, in the original
  details: >-
    In the original, the party finds the Midgar Zolom impaled near the Mythril Mine and takes it
    for Sephiroth's work. That is shown rather than said, so only Rebirth's telling is recorded in
    the event so far.
  entities: [event_midgar_zolom]
  sources:
    - { title: og, disc: 1, segment: og_road_to_junon, scene: "'Did Sephiroth... do this......?'" }

- id: question_full_names
  kind: structure
  summary: Full names not given in the transcripts
  details: >-
    Yuffie's and Jessie's family names don't appear in the transcripts used, so they are recorded
    by first name only. Add their full names, with the title that states them, once checked.
  entities: [character_yuffie, character_jessie]

- id: question_rebirth_interludes
  kind: not_in_dataset
  summary: Rebirth's interludes with Zack and Biggs
  details: >-
    The transcript used marks the interludes in which Zack carries Cloud and meets Biggs as
    missing, so Biggs's part in them isn't recorded. Check against the game and add it as a
    Rebirth appearance in the world where Zack survives.
  entities: [character_biggs, character_zack_fair]
  sources: [{ title: rebirth, chapter: 10, scene: "Undying Wish" }]

- id: question_rebirth_places
  kind: not_in_dataset
  summary: Places Rebirth visits that its transcript doesn't name
  details: >-
    The transcript used is empty for chapter 8 (the Gold Saucer, Corel Prison and the town of
    North Corel), thin for chapter 9, where the party drives south to "another run-down reactor"
    without naming Gongaga, and has nothing for Rocket Town or the Sleeping Forest. Vincent's
    coffin in chapter 11 is in an unnamed room. Add each place's Rebirth appearance, and the
    links that depend on it (Cid in Rocket Town, Zack's hometown, Dyne in Corel Prison, Vincent
    in the Shinra Manor), once checked against the game. The same gap leaves out how Rebirth
    tells the Keystone's theft and Cait Sith's unmasking.
  entities:
    [
      location_gold_saucer,
      location_corel_prison,
      location_corel,
      location_gongaga,
      location_gongaga_reactor,
      location_rocket_town,
      location_sleeping_forest,
      location_shinra_manor,
      event_keystone_stolen,
    ]
  sources:
    - { title: rebirth, chapter: 8 }
    - { title: rebirth, chapter: 9, scene: "'another run-down reactor'" }
    - { title: rebirth, chapter: 11, scene: "Search Resumes" }

- id: question_sonon_death
  kind: needs_footage
  summary: How INTERmission shows Sonon's death (chapter 2)
  details: >-
    Nero strikes Sonon down after the fight in the Shinra Building's depths. The transcript has his
    last words to Yuffie and her grief, but the attack itself is shown rather than said. Check the
    footage before recording it as a death or linking it to Nero.
  entities: [character_sonon_kusakabe]
  sources: [{ title: intermission, chapter: 2, scene: "Dread" }]
